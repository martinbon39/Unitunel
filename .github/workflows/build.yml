name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
            targets: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
            targets: "aarch64-apple-darwin,x86_64-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: npx --yes @tauri-apps/cli@2 build ${{ matrix.args }}
      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          find src-tauri/target -path '*/release/bundle/*' \( -name '*.exe' -o -name '*.dmg' \) -exec cp {} out/ \;
          if [ "$RUNNER_OS" = "Windows" ]; then cp src-tauri/target/release/unitunel.exe out/Unitunel-portable.exe; fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: unitunel-${{ runner.os }}
          path: out/*
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
