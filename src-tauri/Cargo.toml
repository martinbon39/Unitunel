[package]
name = "unitunel"
version = "0.1.1"
edition = "2021"
description = "Parle, pointe, dessine : un tunnel de contexte pour l'IA"

[lib]
name = "unitunel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
hound = "3.5"
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
device_query = "4"
active-win-pos-rs = "0.11"
arboard = { version = "3", features = ["image-data"] }
enigo = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "json", "native-tls"] }
dirs = "6"
chrono = "0.4"
base64 = "0.22"
parking_lot = "0.12"
open = "5"

[target.'cfg(windows)'.dependencies]
uiautomation = "0.25"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
