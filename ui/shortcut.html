<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Raccourci Unitunel</title>
<style>
@font-face { font-family: "Mono"; src: url("fonts/GeistMono-Regular.woff2") format("woff2"); }
:root {
  --c1: #bc82f3; --c3: #8d9fff; --c4: #ff6778;
  --bg: #0e0e12; --card: #17171d; --line: rgba(255,255,255,.09); --text: #f5f5f7; --dim: rgba(245,245,247,.6);
  --ease-out: cubic-bezier(.16, 1, .3, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font: 400 13px/1.45 system-ui, "Segoe UI Variable Text", "SF Pro Text", sans-serif;
  display: flex; flex-direction: column; gap: 14px; padding: 22px; user-select: none; -webkit-user-select: none; }
h1 { font-size: 15px; font-weight: 600; }
p { color: var(--dim); }
#zone { flex: 1; min-height: 96px; border-radius: 14px; background: var(--card); box-shadow: 0 0 0 1px var(--line) inset;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; outline: none; cursor: default;
  transition: box-shadow 200ms ease; }
#zone:focus { box-shadow: 0 0 0 1px var(--line) inset, 0 0 0 2px rgba(141,159,255,.55); }
#zone.ok { box-shadow: 0 0 0 1px var(--line) inset, 0 0 0 2px rgba(188,130,243,.8), 0 0 28px rgba(188,130,243,.25); }
#caps { display: flex; gap: 6px; min-height: 36px; align-items: center; }
kbd { font: 400 15px/1 "Mono", ui-monospace, monospace; min-width: 36px; height: 36px; padding: 0 10px; border-radius: 8px;
  display: grid; place-items: center; background: #24242c; box-shadow: 0 0 0 1px var(--line) inset, 0 2px 0 rgba(0,0,0,.5);
  animation: pop 260ms var(--ease-out); }
kbd.wait { color: var(--dim); background: transparent; box-shadow: 0 0 0 1px var(--line) inset; }
@keyframes pop { from { transform: translateY(3px) scale(.92); opacity: 0; } }
#status { font-size: 12px; color: var(--dim); text-align: center; min-height: 17px; padding: 0 10px; }
#status.err { color: var(--c4); }
.row { display: flex; gap: 8px; }
button { all: unset; height: 32px; padding: 0 14px; border-radius: 8px; font-size: 12.5px; cursor: pointer; text-align: center;
  background: #24242c; box-shadow: 0 0 0 1px var(--line) inset; transition: background 140ms ease, opacity 140ms ease; }
button:hover { background: #2e2e37; }
button:focus-visible { box-shadow: 0 0 0 2px var(--c3); }
button.primary { background: var(--text); color: #111; font-weight: 600; }
button.primary:hover { background: #fff; }
button:disabled { opacity: .35; cursor: default; }
#reset { margin-right: auto; }
@media (prefers-reduced-motion: reduce) { kbd { animation: none; } }
</style>
</head>
<body>
<div>
  <h1>Raccourci d'Unitunel</h1>
  <p>Appuie une fois pour démarrer et une deuxième fois pour envoyer, ou maintiens-le pour parler puis relâche.</p>
</div>
<div id="zone" tabindex="0">
  <div id="caps"></div>
  <div id="status"></div>
</div>
<div class="row">
  <button id="reset"></button>
  <button id="cancel">Fermer</button>
  <button id="save" class="primary" disabled>Enregistrer</button>
</div>
<script>
const T = window.__TAURI__;
const $ = (id) => document.getElementById(id);
const mac = navigator.platform.toUpperCase().includes("MAC");
let current = "";
let pending = null;
let error = false;

function caps(label, waiting) {
  const parts = mac ? (label.match(/^[⌃⌥⇧⌘]*/)[0].split("").concat(label.replace(/^[⌃⌥⇧⌘]*\s?/, "") || [])) : label.split("+");
  $("caps").replaceChildren(...parts.filter(Boolean).map((p) => Object.assign(document.createElement("kbd"), { textContent: p })));
  if (waiting) $("caps").appendChild(Object.assign(document.createElement("kbd"), { className: "wait", textContent: "…" }));
}
function status(text, err) { error = !!err; $("status").textContent = text; $("status").className = err ? "err" : ""; }
function idle() {
  pending = null;
  $("save").disabled = true;
  $("zone").classList.remove("ok");
  caps(current);
  status("Raccourci actuel. Appuie sur une nouvelle combinaison pour le changer.");
}

function mods(e) {
  const m = [];
  if (e.ctrlKey) m.push(["Control", mac ? "⌃" : "Ctrl"]);
  if (e.altKey) m.push(["Alt", mac ? "⌥" : "Alt"]);
  if (e.shiftKey) m.push(["Shift", mac ? "⇧" : "Maj"]);
  if (e.metaKey) m.push(["Super", mac ? "⌘" : "Win"]);
  return m;
}
const MODIFIER_CODES = /^(Control|Alt|Shift|Meta|OS|AltGraph)(Left|Right)?$/;
// Windows registers letters by virtual key, which follows the layout (AZERTY A = KeyQ); macOS registers the physical key.
const keyName = (e) => (!mac && /^[a-z]$/i.test(e.key) ? "Key" + e.key.toUpperCase() : e.code);

$("zone").addEventListener("keydown", async (e) => {
  e.preventDefault();
  if (!mac && e.getModifierState("AltGraph")) {
    pending = null;
    $("save").disabled = true;
    $("zone").classList.remove("ok");
    status("AltGr sert à taper €, @, #… : choisis une autre combinaison", true);
    return;
  }
  const m = mods(e);
  if (MODIFIER_CODES.test(e.code)) {
    pending = null;
    $("save").disabled = true;
    $("zone").classList.remove("ok");
    caps(m.map((x) => x[1]).join(mac ? "" : "+"), true);
    status("Ajoute maintenant une touche (Espace, une lettre, F5…)");
    return;
  }
  if (e.code === "Escape" && !m.length) { idle(); return; }
  const accel = m.map((x) => x[0]).concat(keyName(e)).join("+");
  try {
    const label = await T.core.invoke("describe_shortcut", { accel });
    pending = accel;
    caps(label);
    $("zone").classList.add("ok");
    $("save").disabled = false;
    status("Clique sur Enregistrer pour l'utiliser.");
  } catch (err) {
    pending = null;
    $("save").disabled = true;
    $("zone").classList.remove("ok");
    caps(current);
    status(String(err), true);
  }
});
$("zone").addEventListener("keyup", (e) => { if (!pending && !error && !mods(e).length && MODIFIER_CODES.test(e.code)) idle(); });

async function apply(accel) {
  try {
    current = await T.core.invoke("set_shortcut", { accel });
    caps(current);
    $("save").disabled = true;
    status("Enregistré. Le nouveau raccourci marche tout de suite.");
    setTimeout(() => T.window.getCurrentWindow().close(), 900);
  } catch (err) {
    status(String(err), true);
    $("zone").focus();
  }
}
$("save").onclick = () => pending && apply(pending);
$("cancel").onclick = () => T.window.getCurrentWindow().close();

T.core.invoke("get_shortcut").then((s) => {
  current = s.label;
  $("reset").textContent = "Par défaut (" + s.default + ")";
  $("reset").onclick = () => apply(s.defaultAccel);
  idle();
  $("zone").focus();
});
</script>
</body>
</html>
