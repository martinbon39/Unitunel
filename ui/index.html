<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Unitunel</title>
<style>
@font-face { font-family: "Mono"; src: url("fonts/GeistMono-Regular.woff2") format("woff2"); }
@property --angle { syntax: "<angle>"; inherits: true; initial-value: 0deg; }
:root {
  --level: 0;
  --rail-w: 64px;
  --rail-h: 260px;
  --c1: #ffffff; --c2: #8c8c8c; --c3: #e6e6e6; --c4: #3a3a3a; --c5: #cfcfcf; --c6: #6a6a6a;
  --spectrum: conic-gradient(from var(--angle), var(--c1), var(--c2), var(--c3), var(--c4), var(--c5), var(--c6), var(--c3), var(--c1));
  --glass: rgba(12, 12, 12, .82);
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --spring: cubic-bezier(.34, 1.36, .5, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none;
  font: 500 12px/1 system-ui, "Segoe UI Variable Text", "SF Pro Text", sans-serif; color: #f5f5f5; }

/* ---- Aura: a rotating spectrum, masked to the screen edge, stacked in layers of growing blur. ---- */
#aura { position: fixed; inset: 0; pointer-events: none; z-index: 3; opacity: 0; }
.layer { position: absolute; inset: 0; }
.band { position: absolute; inset: 0; padding: var(--w);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
.band::before { content: ""; position: absolute; inset: 0; background: var(--spectrum); }
.l1 .band { --w: 2px; }
.l2 { filter: blur(6px); }
.l2 .band { --w: calc(6px + var(--level) * 6px); }
.l3 { filter: blur(18px); opacity: calc(.5 + var(--level) * .5); }
.l3 .band { --w: calc(8px + var(--level) * 36px); }
.l4 { filter: blur(60px); opacity: 0; }
.l4 .band { --w: 140px; }
#aura { animation: turn 7s linear infinite; }
@keyframes turn { to { --angle: 360deg; } }

body.on #aura { opacity: 1; transition: opacity 260ms var(--ease-out); }
body.on #aura .l4 { animation: bloom 1100ms var(--ease-out); }
body.on #aura .l3 .band { animation: swell 900ms var(--ease-out); }
@keyframes bloom { 0% { opacity: 0; } 18% { opacity: .95; } 100% { opacity: 0; } }
@keyframes swell { 0% { --w: 0px; } 35% { --w: 90px; } }
@property --w { syntax: "<length>"; inherits: false; initial-value: 0px; }

body.busy #aura { animation-duration: 1.4s; }
body.busy #aura .l3 { opacity: .9; animation: breathe 1.2s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .45; } }
body.send #aura .l4 { animation: bloom 700ms var(--ease-out); }
body.out #aura { opacity: 0; transition: opacity 420ms ease; }

/* ---- Status pill ---- */
#chip { position: fixed; left: 50%; bottom: 22px; z-index: 4; height: 32px; padding: 0 14px 0 12px; display: flex; align-items: center; gap: 10px;
  border-radius: 999px; background: var(--glass); box-shadow: 0 0 0 1px rgba(255,255,255,.08) inset, 0 10px 30px rgba(0,0,0,.35);
  transform: translate(-50%, 70px) scale(.9); opacity: 0; pointer-events: none; white-space: pre;
  transition: transform 520ms var(--spring), opacity 200ms ease; }
body.on #chip { transform: translate(-50%, 0) scale(1); opacity: 1; }
body.out #chip { transform: translate(-50%, 20px) scale(.96); opacity: 0; transition-duration: 300ms; }
#bars { display: flex; align-items: center; gap: 2px; height: 16px; }
#bars i { width: 3px; border-radius: 2px; height: 3px; background: linear-gradient(#fff, #9a9a9a); background-size: 100% 16px; transition: height 90ms ease; }
#label { font: 400 11px/1 "Mono", ui-monospace, monospace; letter-spacing: .04em; color: rgba(245,245,245,.72); }
#spinner { display: none; width: 14px; height: 14px; border-radius: 50%; background: var(--spectrum);
  -webkit-mask: radial-gradient(circle, transparent 4.5px, #000 5px); mask: radial-gradient(circle, transparent 4.5px, #000 5px); }
body.busy #bars { display: none; }
body.busy #spinner { display: block; }

/* ---- Rail ---- */
#rail { position: fixed; right: 0; top: 50%; width: var(--rail-w); height: var(--rail-h); transform: translateY(-50%); z-index: 4;
  display: flex; align-items: center; justify-content: flex-end; pointer-events: auto; }
#rail .grip { width: 4px; height: 44px; margin-right: 6px; border-radius: 4px; background: rgba(255,255,255,.75);
  box-shadow: 0 0 0 1px rgba(0,0,0,.35), 0 0 12px rgba(255,255,255,.6); transition: opacity 160ms ease, transform 300ms var(--spring); }
#rail .bar { position: absolute; right: 14px; display: flex; flex-direction: column; gap: 4px; padding: 5px; border-radius: 22px;
  background: var(--glass); box-shadow: 0 0 0 1px rgba(255,255,255,.08) inset, 0 12px 40px rgba(0,0,0,.4);
  transform: translateX(calc(100% + 24px)) scale(.92); opacity: 0; transition: transform 420ms var(--spring), opacity 160ms ease; }
#rail:hover .bar, body.draw #rail .bar, body.board #rail .bar { transform: none; opacity: 1; }
#rail:hover .grip { opacity: 0; transform: scaleY(.4); }
#rail button { all: unset; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; color: #f5f5f5; cursor: pointer; position: relative;
  transition: background 140ms ease, transform 200ms var(--spring); }
#rail button:hover { background: rgba(255,255,255,.12); }
#rail button:active { transform: scale(.9); }
#rail button.on { background: #f5f5f5; color: #111; }
#rail button::after { content: attr(data-tip); position: absolute; right: 52px; padding: 7px 10px; border-radius: 10px; background: var(--glass); font-size: 11px; white-space: nowrap;
  opacity: 0; transform: translateX(6px); transition: opacity 120ms ease, transform 200ms var(--ease-out); pointer-events: none; }
#rail button:hover::after { opacity: 1; transform: none; }
body:not(.on) #rail, body.busy #rail { display: none; }

/* ---- Whiteboard: opens out of the rail button like a lens, closes back into it. ---- */
#board { position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background: radial-gradient(120% 90% at 50% 40%, #161616 0%, #0a0a0a 70%);
  clip-path: circle(0px at var(--ox, 100%) var(--oy, 50%)); transition: clip-path 380ms cubic-bezier(.4, 0, .9, .4); }
#board::after { content: ""; position: absolute; inset: 0; opacity: .5;
  background-image: radial-gradient(rgba(255,255,255,.09) 1px, transparent 1.4px); background-size: 26px 26px; }
body.board #board { clip-path: circle(150vmax at var(--ox, 100%) var(--oy, 50%)); transition: clip-path 720ms var(--ease-out); }
#board .title { position: absolute; left: 50%; top: 34px; transform: translate(-50%, -10px); opacity: 0; font: 400 11px "Mono", monospace; letter-spacing: .14em;
  text-transform: uppercase; color: rgba(245,245,245,.38); transition: opacity 300ms ease 260ms, transform 500ms var(--ease-out) 260ms; }
body.board #board .title { opacity: 1; transform: translate(-50%, 0); }

/* ---- Drawing ---- */
#ink { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
body.draw #ink, body.board #ink { pointer-events: auto; cursor: crosshair; }
body.draw #aura .l3 { opacity: .35; }

/* A click: a small aura ripple where the capture was marked. */
.ripple { position: fixed; z-index: 4; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; pointer-events: none;
  box-shadow: 0 0 0 2px rgba(255,255,255,.95), 0 0 0 3.5px rgba(0,0,0,.45), 0 0 18px 4px rgba(255,255,255,.6), 0 0 34px 10px rgba(255,255,255,.25);
  animation: ripple 620ms var(--ease-out) forwards; }
@keyframes ripple { from { transform: scale(.4); opacity: 1; } to { transform: scale(3.2); opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  #aura { animation: none; }
  body.on #aura .l4, body.on #aura .l3 .band { animation: none; }
}
</style>
</head>
<body>
<div id="board"><div class="title">tableau</div></div>
<canvas id="ink"></canvas>
<div id="aura">
  <div class="layer l4"><div class="band"></div></div>
  <div class="layer l3"><div class="band"></div></div>
  <div class="layer l2"><div class="band"></div></div>
  <div class="layer l1"><div class="band"></div></div>
</div>
<div id="chip"><div id="bars"></div><div id="spinner"></div><span id="label"></span></div>
<div id="rail">
  <div class="grip"></div>
  <div class="bar">
    <button id="b-draw" data-tip="Dessiner sur l'écran">✎</button>
    <button id="b-board" data-tip="Tableau blanc">◫</button>
    <button id="b-send" data-tip="Envoyer">↑</button>
    <button id="b-cancel" data-tip="Annuler">✕</button>
  </div>
</div>
<script>
const T = window.__TAURI__;
const invoke = (c, a) => T.core.invoke(c, a).catch(() => {});
const $ = (id) => document.getElementById(id);
const body = document.body;
const root = document.documentElement;

const NBARS = 5;
for (let i = 0; i < NBARS; i++) $("bars").appendChild(document.createElement("i"));
const bars = [...$("bars").children];

let mode = "live";
let state = "idle";
let level = 0;

const clock = (t) => { const s = Math.floor(t); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };
const setLabel = (text) => { $("label").textContent = text; };

function reset() {
  body.className = "";
  mode = "live";
  strokes = [];
  clearInk();
  setLabel("");
  level = 0;
  root.style.setProperty("--level", 0);
}

T.event.listen("tunnel", ({ payload }) => {
  state = payload.state;
  if (state === "recording") {
    reset();
    void body.offsetWidth;
    body.className = "on";
    setLabel("00:00");
  } else if (state === "processing") {
    flushStrokes();
    invoke("flushed");
    applyMode("live");
    body.classList.add("busy");
    setLabel("transcription");
  } else if (state === "done") {
    body.classList.remove("busy");
    body.classList.add("send");
    setLabel(payload.warning ? payload.warning.slice(0, 90) : `collé · ${payload.chars} car.`);
    setTimeout(() => body.classList.add("out"), payload.warning ? 2800 : 220);
  } else if (state === "cancelled") {
    strokes = [];
    clearInk();
    invoke("flushed");
    applyMode("live");
    setLabel("annulé");
    body.classList.add("out");
  } else if (state === "error") {
    body.className = "on";
    setLabel(payload.message.slice(0, 90));
    setTimeout(() => body.classList.add("out"), 2800);
  }
});

T.event.listen("level", ({ payload }) => {
  if (state !== "recording") return;
  const target = Math.min(1, Math.sqrt(payload.level) * 3.2);
  level += (target - level) * (target > level ? 0.55 : 0.18);
  root.style.setProperty("--level", level.toFixed(3));
  const now = performance.now() / 140;
  bars.forEach((b, i) => {
    const wobble = 0.55 + 0.45 * Math.sin(now + i * 1.7);
    b.style.height = (3 + level * 13 * wobble) + "px";
  });
  const what = mode === "draw" ? "  ·  dessin" : mode === "board" ? "  ·  tableau" : "";
  setLabel(clock(payload.t) + what);
});

T.event.listen("hint", ({ payload }) => setLabel(payload.text));

T.event.listen("click", ({ payload }) => {
  const r = document.createElement("div");
  r.className = "ripple";
  r.style.left = payload.x + "px";
  r.style.top = payload.y + "px";
  document.body.appendChild(r);
  setTimeout(() => r.remove(), 700);
});

T.event.listen("mode", ({ payload }) => applyMode(payload.mode));

/* ---- drawing ---- */
const cv = $("ink");
const ctx = cv.getContext("2d");
let strokes = [];
let current = null;

function fit() {
  const r = devicePixelRatio || 1;
  cv.width = innerWidth * r; cv.height = innerHeight * r;
  ctx.setTransform(r, 0, 0, r, 0, 0);
  redraw();
}
addEventListener("resize", fit);

function clearInk() { ctx.clearRect(0, 0, innerWidth, innerHeight); }

function paint(s) {
  const pts = s.map(([x, y]) => [x * innerWidth, y * innerHeight]);
  const path = () => {
    ctx.beginPath();
    pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
    if (pts.length === 1) ctx.lineTo(pts[0][0] + 0.1, pts[0][1]);
  };
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.save();
  ctx.shadowColor = "rgba(255,255,255,.55)"; ctx.shadowBlur = 16;
  ctx.lineWidth = 6; ctx.strokeStyle = "rgba(0,0,0,.55)"; path(); ctx.stroke();
  ctx.restore();
  ctx.lineWidth = 3.5; ctx.strokeStyle = "#f5f5f5"; path(); ctx.stroke();
}
function redraw() { clearInk(); strokes.forEach(paint); if (current) paint(current); }

cv.addEventListener("pointerdown", (e) => {
  if (e.button === 2) { setMode("live"); return; }
  try { cv.setPointerCapture(e.pointerId); } catch {}
  current = [[e.clientX / innerWidth, e.clientY / innerHeight]];
});
cv.addEventListener("pointermove", (e) => {
  if (!current) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  for (const ev of evs.length ? evs : [e]) current.push([ev.clientX / innerWidth, ev.clientY / innerHeight]);
  redraw();
});
cv.addEventListener("pointerup", () => { if (current) { strokes.push(current); current = null; redraw(); } });
cv.addEventListener("contextmenu", (e) => e.preventDefault());

/* Leaving a mode hands its drawing to the tunnel: screen strokes are burnt into a capture, the board is saved as an image. */
function flushStrokes() {
  if (!strokes.length) return;
  if (mode === "board") invoke("board", { png: exportBoard() });
  else invoke("stroke", { strokes });
  strokes = [];
  clearInk();
}

function exportBoard() {
  const c = document.createElement("canvas");
  c.width = cv.width; c.height = cv.height;
  const g = c.getContext("2d");
  g.fillStyle = "#0a0a0a"; g.fillRect(0, 0, c.width, c.height);
  g.drawImage(cv, 0, 0);
  return c.toDataURL("image/png");
}

function originFromButton() {
  const r = $("b-board").getBoundingClientRect();
  const x = r.width ? r.left + r.width / 2 : innerWidth - 34;
  const y = r.height ? r.top + r.height / 2 : innerHeight / 2;
  root.style.setProperty("--ox", x + "px");
  root.style.setProperty("--oy", y + "px");
}

function applyMode(next) {
  if (next === mode) return;
  flushStrokes();
  if (next === "board" || mode === "board") originFromButton();
  mode = next;
  body.classList.toggle("draw", mode === "draw");
  body.classList.toggle("board", mode === "board");
  $("b-draw").classList.toggle("on", mode === "draw");
  $("b-board").classList.toggle("on", mode === "board");
}
function setMode(next) { applyMode(next); invoke("set_mode", { mode: next }); }

$("b-draw").onclick = () => setMode(mode === "draw" ? "live" : "draw");
$("b-board").onclick = () => setMode(mode === "board" ? "live" : "board");
$("b-send").onclick = () => { setMode("live"); invoke("finish", { keep: true }); };
$("b-cancel").onclick = () => invoke("finish", { keep: false });

fit();
</script>
</body>
</html>
